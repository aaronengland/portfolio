{{ if .Values.enableHA }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: risk-scorecard-dlv2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: risk-scorecard-dlv2
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

{{ end }}
